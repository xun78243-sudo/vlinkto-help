<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>微联叮小助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <div class="logo">叮</div>
      <div class="brand-text">
        <h1>微联叮小助手</h1>
        <p>自动获取 access-token · 按聊天记录自动创建考试日程</p>
      </div>
    </div>
    <span class="version" id="version">v1.0.0</span>
  </header>

  <main class="content">
    <section class="card">
      <div class="card-head">
        <div class="card-title">
          <h2>账号</h2>
          <p class="hint">从微联叮客户端自动读取当前登录状态</p>
        </div>
        <button id="btn-refresh" class="btn ghost">重新获取 Token</button>
      </div>
      <div id="token-body" class="token-body">
        <span class="dot dot-idle"></span>
        <span class="token-text">正在读取…</span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="card-title">
          <h2>考试日程小助理</h2>
          <p class="hint" id="exam-hint">打开开关后立即检测一次，之后每 3 小时自动执行</p>
        </div>
        <label class="switch" title="开启 / 关闭自动检测">
          <input type="checkbox" id="exam-switch">
          <span class="slider"></span>
        </label>
      </div>

      <div class="stat-row">
        <div class="stat">
          <span class="stat-label">运行状态</span>
          <strong id="exam-state">已关闭</strong>
        </div>
        <div class="stat">
          <span class="stat-label">上次执行</span>
          <strong id="exam-last">—</strong>
        </div>
        <div class="stat">
          <span class="stat-label">下次执行</span>
          <strong id="exam-next">—</strong>
        </div>
        <div class="stat">
          <span class="stat-label">上次结果</span>
          <strong id="exam-result">—</strong>
        </div>
      </div>

      <div class="actions">
        <button id="btn-run" class="btn primary">立即执行一次</button>
        <label class="check">
          <input type="checkbox" id="dry-run">
          <span>试运行（只判定，不创建日程）</span>
        </label>
        <span class="spacer"></span>
        <button id="btn-logs" class="btn ghost small">打开日志目录</button>
        <button id="btn-config" class="btn ghost small">打开配置文件</button>
      </div>
    </section>

    <section class="card log-card">
      <div class="card-head">
        <div class="card-title">
          <h2>运行日志</h2>
          <p class="hint">同一天的日志也会写入 logs 目录</p>
        </div>
        <button id="btn-clear" class="btn ghost small">清空显示</button>
      </div>
      <div id="log-view" class="log-view"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-info">关闭窗口后会隐藏到系统托盘，托盘图标右键可重新打开或退出</span>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
